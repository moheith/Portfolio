<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Squircle Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0c"/>
      <stop offset="50%" stop-color="#0b0607"/>
      <stop offset="100%" stop-color="#050304"/>
    </linearGradient>

    <!-- Subtle Metallic Crimson Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b3e"/>
      <stop offset="50%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#5a1014"/>
    </linearGradient>

    <!-- Radiant Crimson Chevron -->
    <linearGradient id="redM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5549"/>
      <stop offset="60%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#c91f16"/>
    </linearGradient>

    <!-- Crisp White Pillars -->
    <linearGradient id="whitePillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile (Never clipped, leaves 2px margin) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tileGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Specular Highlight -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Centered Architectural "M" Mark (Width 38px, centered between 13px and 51px) -->
  <g>
    <!-- Left Pillar -->
    <rect x="13" y="16" width="7" height="32" rx="1.5" fill="url(#whitePillar)"/>

    <!-- Right Pillar -->
    <rect x="44" y="16" width="7" height="32" rx="1.5" fill="url(#whitePillar)"/>

    <!-- Left Diagonal Chevron -->
    <polygon points="20,16 32,32 32,40 20,24" fill="url(#redM)"/>

    <!-- Right Diagonal Chevron -->
    <polygon points="44,16 32,32 32,40 44,24" fill="url(#redM)"/>

    <!-- Center Glowing Apex Diamond -->
    <polygon points="32,23 37,29 32,35 27,29" fill="#ffffff"/>
    <polygon points="32,25 35.5,29 32,33 28.5,29" fill="url(#redM)"/>
    <circle cx="32" cy="29" r="1.5" fill="#ffffff"/>
  </g>
</svg>