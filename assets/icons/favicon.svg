<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140809"/>
      <stop offset="50%" stop-color="#0a0506"/>
      <stop offset="100%" stop-color="#050304"/>
    </linearGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b3e" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ff3b30" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a0a0c" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Monogram Crimson Radiant Gradient -->
    <linearGradient id="mCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5247"/>
      <stop offset="50%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#c41a10"/>
    </linearGradient>

    <!-- Monogram Pure White-to-Silver Gradient for Left/Right Stems -->
    <linearGradient id="mWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f0f5"/>
      <stop offset="100%" stop-color="#d4d4dc"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ff3b30" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for M -->
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#ff3b30" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#coreGlow)"/>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="10"/>

  <!-- Inner Sub-Bevel -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Monogram Mark "M" (Architectural, High-Tech, High Contrast) -->
  <g filter="url(#mShadow)">
    <!-- Left Pillar Stem -->
    <path d="M 104 380 L 104 140 L 168 140 L 168 380 Z" fill="url(#mWhite)"/>

    <!-- Right Pillar Stem -->
    <path d="M 344 380 L 344 140 L 408 140 L 408 380 Z" fill="url(#mWhite)"/>

    <!-- Left Diagonal Chevron -->
    <path d="M 168 140 L 256 276 L 220 332 L 132 196 Z" fill="url(#mCrimson)"/>

    <!-- Right Diagonal Chevron -->
    <path d="M 344 140 L 256 276 L 292 332 L 380 196 Z" fill="url(#mCrimson)"/>

    <!-- Central Glowing Apex Diamond Node -->
    <polygon points="256,196 296,256 256,316 216,256" fill="#ffffff"/>
    <polygon points="256,212 284,256 256,300 228,256" fill="url(#mCrimson)"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>
  </g>

  <!-- Cybernetic Corner Accent Marks -->
  <path d="M 72 108 L 72 72 L 108 72" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 440 108 L 440 72 L 404 72" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 72 404 L 72 440 L 108 440" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 440 404 L 440 440 L 404 440" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>